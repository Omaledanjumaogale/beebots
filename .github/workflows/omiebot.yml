name: OmieBot validation
on:
  push:
    branches: [main, 'codex/**']
    paths: ['web/**', 'edge/**', 'decision-engine/**', 'research-engine/**', '.github/workflows/omiebot.yml']
  pull_request:
permissions:
  contents: read
jobs:
  terminal:
    env:
      PUBLIC_CONVEX_URL: https://shocking-fennec-152.eu-west-1.convex.cloud
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run check
      - run: npm test
      - run: npx tsc --noEmit --strict --target ES2022 --module ESNext --moduleResolution Bundler --skipLibCheck convex/*.ts
      - run: npm run build
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx vitest run --config edge/vitest.config.js
      - run: node edge/check.mjs
      - run: node --test decision-engine/test/*.test.mjs
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s research-engine -v
